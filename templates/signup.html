<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Speech to Signs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="auth-body">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="auth-wrapper">
        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                <span class="auth-logo-icon">🤟</span>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join Speech to Signs today</p>
            </div>

            <!-- Error message -->
            {% if error %}
            <div class="auth-alert auth-alert-error">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <!-- Form -->
            <form method="POST" action="/signup" class="auth-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name"
                           placeholder="Your name"
                           value="{{ name or '' }}" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com"
                           value="{{ email or '' }}" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password <span class="label-hint">(min. 6 characters)</span></label>
                    <div class="input-with-toggle">
                        <input type="password" id="password" name="password"
                               placeholder="Create a password"
                               required autocomplete="new-password">
                        <button type="button" class="toggle-pw" onclick="togglePw('password', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-auth btn-auth-green">Create Account →</button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="/login">Sign in</a>
            </p>

        </div>
    </div>

    <script>
        function togglePw(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
