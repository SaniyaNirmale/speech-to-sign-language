<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Speech to Signs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="auth-body">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="auth-wrapper">
        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                <span class="auth-logo-icon">🤟</span>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to Speech to Signs</p>
            </div>

            <!-- Success message -->
            {% if success %}
            <div class="auth-alert auth-alert-success">
                🎉 Account created successfully! Please log in.
            </div>
            {% endif %}

            <!-- Error message -->
            {% if error %}
            <div class="auth-alert auth-alert-error">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <!-- Form -->
            <form method="POST" action="/login" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-toggle">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-pw" onclick="togglePw('password', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-auth">Sign In →</button>
            </form>

            <p class="auth-switch">
                Don't have an account? <a href="/signup">Create one</a>
            </p>

        </div>
    </div>

    <script>
        function togglePw(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
